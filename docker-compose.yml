services:
  gateway:
    image: 'gateway-server:latest'
    build:
      dockerfile: Dockerfile
    container_name: gateway-server
    ports: 
      - "8000:8080"
    networks:
      - microservices-network
    environment:
      - KEYCLOAK_URL=http://keycloak-service:8080
      - REALM_NAME=cab-aggregator
networks:
  microservices-network:
    external: true
